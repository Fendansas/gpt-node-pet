services:
  mongo:
    image: mongo:7
    container_name: mongo-db-gpt
    ports:
      - "27016:27017"
    environment:
      MONGO_INITDB_DATABASE: gpt-app
    volumes:
      - mongo-data:/data/db
  redis:
    image: redis:7-alpine
    container_name: redis-gpt
    ports:
      - "6379:6379"
volumes:
  mongo-data: